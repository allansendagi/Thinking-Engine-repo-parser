<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Thread</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        width: 328px;
      }
      .popup {
        padding: 16px 16px 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 14px;
      }
      .brand svg {
        width: 22px;
        height: 22px;
        color: var(--accent);
        flex: none;
      }
      .brand .wordmark {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .brand .env {
        margin-left: auto;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      .statusline {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        background: var(--muted);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--muted) 18%, transparent);
      }
      .dot.paired {
        background: #1e8e3e;
        box-shadow: 0 0 0 3px color-mix(in srgb, #1e8e3e 18%, transparent);
      }
      .dot.unpaired,
      .dot.rejected {
        background: #d93025;
        box-shadow: 0 0 0 3px color-mix(in srgb, #d93025 18%, transparent);
      }
      details summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
        margin: 12px 0 8px;
        user-select: none;
      }
      details summary:hover {
        color: var(--text);
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin: 8px 0;
        line-height: 1.5;
      }
      button.block {
        width: 100%;
        justify-content: center;
      }
      .foot {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="6.1" stroke="currentColor" stroke-width="2" />
          <path d="M4.2 19.8C10 13 14 11 19.8 4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <circle cx="12" cy="12" r="2.15" fill="currentColor" />
        </svg>
        <span class="wordmark">Thread</span>
        <span class="env">Continuity Layer</span>
      </div>

      <div class="card">
        <div class="statusline">
          <span id="dot" class="dot"></span>
          <span id="statusText">Checking…</span>
        </div>
        <div id="statusDetail" class="hint" style="margin-bottom: 0"></div>
      </div>

      <button id="connect" class="primary block" style="margin-top: 10px">Connect to Thread for Mac</button>

      <details>
        <summary>Pair with a code instead</summary>
        <p class="hint">
          In Thread for Mac → Settings, copy the pairing string and paste it here. Format:
          <code>user_…:…</code>
        </p>
        <input id="pairingString" type="text" placeholder="user_xxxxxxxx…:xxxxxxxx…" />
        <div class="row" style="margin-top: 8px">
          <button id="usePairingString" class="primary">Use this pairing string</button>
        </div>
      </details>

      <details>
        <summary>Advanced</summary>
        <label for="apiBaseUrl">API base URL</label>
        <div class="row">
          <input id="apiBaseUrl" type="text" placeholder="https://…" />
          <button id="saveUrl">Save</button>
        </div>
      </details>

      <div id="error" class="error"></div>

      <div class="foot">Your thinking, kept continuous across ChatGPT, Claude &amp; Gemini.</div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
