name: Mac app — latest build

# Every change to the Mac app or the extension on main builds a fresh universal Thread.dmg (on a
# GitHub Mac) plus the extension zip, and publishes both as the `mac-latest` pre-release,
# replacing the previous one. The website's admin
# page and download links point at its stable URL:
#   https://github.com/<repo>/releases/download/mac-latest/Thread.dmg
#
# UNSIGNED (ad-hoc) -- there is no Developer ID yet. macOS asks the user to approve it once in
# System Settings > Privacy & Security > Open Anyway. Signed, notarized, auto-updating releases
# are release-mac.yml (needs the Apple secrets listed there). A pre-release never becomes
# "latest", so Sparkle's appcast (releases/latest) is untouched.

on:
  push:
    # The working branch too, so a build exists before its next merge (it only ever carries main
    # plus not-yet-merged app work).
    branches: ["main", "claude/zen-faraday-hi9ive"]
    paths: ["macos-app/**", "extension/**", ".github/workflows/build-mac-latest.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: macos-app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Build the extension zip
        working-directory: extension
        run: |
          ./package.sh
          cp dist-package/thread-extension-*.zip "$RUNNER_TEMP/thread-extension.zip"

      - name: Build Thread.dmg
        env:
          THREAD_VERSION: 0.3.${{ github.run_number }}
        run: ./package.sh

      - name: Publish as mac-latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.3.${{ github.run_number }}
        run: |
          # Update the release IN PLACE. Deleting and recreating it (the old approach) races with
          # GitHub's tag cleanup: the new release sometimes came out as an untagged draft, and the
          # download link 404'd for the length of every run.
          cp dist/Thread.dmg "dist/Thread-${VERSION}.dmg"
          TITLE="Thread for Mac ${VERSION} (latest build)"
          NOTES="Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Unsigned: on first open, approve it in System Settings > Privacy & Security > Open Anyway. Extension: unzip thread-extension.zip, then chrome://extensions > Developer mode > Load unpacked (or Reload if already loaded from that folder)."

          # Leftover drafts from the old race.
          gh release list --limit 50 --json tagName,isDraft,name \
            --jq '.[] | select(.isDraft and (.name | startswith("Thread for Mac"))) | .tagName' |
            while read -r t; do gh release delete "$t" --yes || true; done

          # Point the tag at this commit (create it the first time).
          if ! gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/mac-latest" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/mac-latest" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if ! gh release view mac-latest >/dev/null 2>&1; then
            gh release create mac-latest --verify-tag --prerelease --latest=false \
              --title "$TITLE" --notes "$NOTES"
          fi

          # Drop the previous versioned dmg, then upload (the stable names are replaced in place).
          gh release view mac-latest --json assets --jq '.assets[].name' |
            { grep -E '^Thread-[0-9.]+\.dmg$' || true; } |
            while read -r a; do gh release delete-asset mac-latest "$a" --yes || true; done
          gh release upload mac-latest dist/Thread.dmg "dist/Thread-${VERSION}.dmg" \
            "$RUNNER_TEMP/thread-extension.zip" --clobber
          gh release edit mac-latest --title "$TITLE" --notes "$NOTES" --prerelease --latest=false

          # Never report success unless the stable link is real.
          draft=$(gh release view mac-latest --json isDraft --jq .isDraft)
          [ "$draft" = "false" ] || { echo "mac-latest is a draft"; exit 1; }
          curl -fsSL -r 0-0 -o /dev/null "https://github.com/${GITHUB_REPOSITORY}/releases/download/mac-latest/Thread.dmg"
